<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>216 Web 安全色表 (修复版)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding: 20px; background: #fff; border-radius: 12px; }
        header h1 { margin-bottom: 10px; }
        header p { color: #666; line-height: 1.6; }
        .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .color-card { aspect-ratio: 1 / 1; border-radius: 8px; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
        .color-card:hover { transform: scale(1.08); }
        .color-code { background: rgba(255, 255, 255, 0.9); padding: 4px; border-radius: 4px; font-family: monospace; font-weight: bold; text-align: center; font-size: 0.8em; color: #333; }
        .dark-text .color-code { background: rgba(0, 0, 0, 0.7); color: #fff; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; padding: 12px 24px; border-radius: 25px; opacity: 0; transition: opacity .3s; z-index: 1000; }
        .toast.show { opacity: 1; }
        @media (max-width: 900px) { .color-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 600px) { .color-grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎨 216 Web 安全色表</h1>
        <p>点击任意色块即可复制颜色代码</p>
    </header>
    <div class="color-grid" id="colorGrid"></div>
</div>

<div class="toast" id="toast">✅ 颜色代码已复制!</div>

<script>
    const colorGrid = document.getElementById('colorGrid');
    const toast = document.getElementById('toast');
    const values = ['00', '33', '66', '99', 'CC', 'FF'];

    // 1. 生成色块
    values.forEach(r => {
        values.forEach(g => {
            values.forEach(b => {
                const hex = `#${r}${g}${b}`;
                const isDark = r <= '66' && g <= '66' && b <= '66';
                
                const card = document.createElement('div');
                card.className = `color-card ${isDark ? 'dark-text' : ''}`;
                card.style.backgroundColor = hex;
                card.innerHTML = `<div class="color-code">${hex}</div>`;
                colorGrid.appendChild(card);
            });
        });
    });

    // 2. 【修复版】点击复制逻辑
    // 使用 document.execCommand 兼容更多环境（包括本地文件打开）
    colorGrid.addEventListener('click', function(e) {
        const card = e.target.closest('.color-card');
        if (!card) return;

        const colorCode = card.querySelector('.color-code').innerText;
        
        // 创建一个临时输入框
        const input = document.createElement('input');
        input.value = colorCode;
        document.body.appendChild(input);
        
        // 选中并复制
        input.select();
        input.setSelectionRange(0, 99999); // 兼容移动端
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            } else {
                alert('复制失败，请手动复制: ' + colorCode);
            }
        } catch (err) {
            alert('复制出错，请手动复制: ' + colorCode);
        }
        
        // 移除临时输入框
        document.body.removeChild(input);
    });
</script>

</body>
</html>
